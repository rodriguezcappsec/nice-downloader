[package]
name = "nice-downloader"
version = "0.1.0"
description = "A Linux-first desktop media download manager"
authors = ["Nice Downloader contributors"]
edition = "2021"

[lib]
name = "nice_downloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
notify = "8"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "system-proxy"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
trash = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
which = "8"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["fs", "signal"] }

[dev-dependencies]
tempfile = "3"
