name: Release Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  bundle:
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Prepare verified bundled engines
        run: npm run engines:prepare
      - name: Build portable executable
        run: npm run tauri:build -- --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: nice-downloader-windows-portable-${{ github.ref_name }}
          path: |
            src-tauri/target/release/nice-downloader.exe
            src-tauri/target/release/engines/
          if-no-files-found: error
      - name: Build NSIS installer
        shell: pwsh
        run: |
          $attempts = 3
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            npm run tauri:build -- --bundles nsis
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -eq $attempts) { exit $LASTEXITCODE }
            Write-Warning "NSIS packaging attempt $attempt failed; retrying in 15 seconds."
            Start-Sleep -Seconds 15
          }
      - uses: actions/upload-artifact@v4
        with:
          name: nice-downloader-windows-${{ github.ref_name }}
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
